<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FinFlow — การเงินของฉัน</title>
<meta name="description" content="จัดการและทำนายการเงินส่วนตัว — แก้ได้ทุกช่อง ทำนายไปข้างหน้าได้จริง">
<meta name="theme-color" content="#0a0b0f">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FinFlow">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="shell">

  <!-- ── แถบข้าง (เดสก์ท็อป) / แถบล่าง (มือถือ) ── -->
  <nav class="nav" id="nav">
    <div class="nav-brand">
      <span class="nav-logo"><svg viewBox="0 0 24 24" fill="none"><path d="M4 17.5 9.5 12l3.5 3.2L20 7"/><circle cx="20" cy="7" r="2" fill="currentColor" stroke="none"/></svg></span>
      <span class="nav-title">FinFlow</span>
    </div>

    <!-- ไอคอนเป็น SVG เส้นชุดเดียวกันทั้งแถบ (stroke 1.7, ปลายมน)
         เดิมใช้ตัวอักษรสัญลักษณ์ ◈▦▤ ซึ่งความหนา/ขนาดไม่เท่ากันในแต่ละฟอนต์ จึงดูไม่เป็นชุด -->
    <!-- หน้าแรก: เส้นเวลา — เปิดแอปมาต้องเห็นทันทีว่าต้องจ่ายอะไรก่อน -->
    <button class="nav-item on" data-screen="timeline"><i><svg viewBox="0 0 24 24" fill="none">
      <path d="M3 12h18"/><path d="M8 12V6.5"/><path d="M8 6.5 6.4 8.6M8 6.5l1.6 2.1"/>
      <path d="M15 12v5.5"/><path d="M15 17.5l-1.6-2.1M15 17.5l1.6-2.1"/>
    </svg></i><span>เส้นเวลา</span></button>

    <button class="nav-item" data-screen="dashboard"><i><svg viewBox="0 0 24 24" fill="none">
      <rect x="3" y="3" width="7.5" height="9" rx="2"/><rect x="13.5" y="3" width="7.5" height="5.5" rx="2"/>
      <rect x="3" y="15" width="7.5" height="6" rx="2"/><rect x="13.5" y="11.5" width="7.5" height="9.5" rx="2"/>
    </svg></i><span>ภาพรวม</span></button>

    <button class="nav-item" data-screen="calendar"><i><svg viewBox="0 0 24 24" fill="none">
      <rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>
      <circle cx="8.5" cy="14.5" r="1.1" fill="currentColor" stroke="none"/>
      <circle cx="12" cy="14.5" r="1.1" fill="currentColor" stroke="none"/>
      <circle cx="15.5" cy="14.5" r="1.1" fill="currentColor" stroke="none"/>
      <circle cx="8.5" cy="18" r="1.1" fill="currentColor" stroke="none"/>
      <circle cx="12" cy="18" r="1.1" fill="currentColor" stroke="none"/>
    </svg></i><span>ปฏิทิน</span></button>

    <button class="nav-item" data-screen="month"><i><svg viewBox="0 0 24 24" fill="none">
      <path d="M9 6h11M9 12h11M9 18h11"/>
      <circle cx="4.5" cy="6" r="1.4" fill="currentColor" stroke="none"/>
      <circle cx="4.5" cy="12" r="1.4" fill="currentColor" stroke="none"/>
      <circle cx="4.5" cy="18" r="1.4" fill="currentColor" stroke="none"/>
    </svg></i><span>รายเดือน</span></button>

    <button class="nav-item more" data-screen="cards"><i><svg viewBox="0 0 24 24" fill="none">
      <rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19M6 15h4"/>
    </svg></i><span>บัตร</span></button>

    <button class="nav-item more" data-screen="savings"><i><svg viewBox="0 0 24 24" fill="none">
      <path d="M3 8.5c0-1.4 1.1-2.5 2.5-2.5h13A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/>
      <path d="M3 9.5 15.5 4.2a1.6 1.6 0 0 1 2.2 1v1.3"/>
      <circle cx="16.5" cy="13" r="1.5" fill="currentColor" stroke="none"/>
    </svg></i><span>เงินเก็บ</span></button>

    <button class="nav-item more" data-screen="forecast"><i><svg viewBox="0 0 24 24" fill="none">
      <path d="M3 20V4M3 20h18"/><path d="M6.5 15.5 11 11l3 2.6 5.2-6"/>
      <path d="M15.6 7.6h3.8v3.6"/>
    </svg></i><span>ทำนาย</span></button>

    <button class="nav-item more" data-screen="split"><i><svg viewBox="0 0 24 24" fill="none">
      <path d="M4 8h13M13.5 4.5 17 8l-3.5 3.5"/><path d="M20 16H7M10.5 12.5 7 16l3.5 3.5"/>
    </svg></i><span>หารครึ่ง</span></button>

    <!-- แถบล่างบนมือถือใส่ได้ 5 ปุ่มถึงจะยังกดไม่พลาด — ที่เหลือยุบมาอยู่ในปุ่มนี้ -->
    <button class="nav-item only-phone" id="nav-more"><i><svg viewBox="0 0 24 24" fill="none">
      <circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/>
      <circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/>
      <circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/>
    </svg></i><span>เพิ่มเติม</span></button>

    <div class="nav-foot">
      <button class="nav-mini" id="btn-data" title="ข้อมูล">⋯</button>
    </div>
  </nav>

  <!-- ── เนื้อหา ── -->
  <main class="main" id="main"></main>
</div>

<!-- แผงลอย (แก้ไข / โน้ต / เมนู) -->
<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" hidden>
  <header class="sheet-head">
    <h2 id="sheet-title">แก้ไข</h2>
    <button class="icon-btn" data-close>✕</button>
  </header>
  <div class="sheet-body" id="sheet-body"></div>
</section>

<div class="toast" id="toast" hidden></div>

<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/engine.js"></script>
<script src="js/chart.js"></script>
<script src="js/edit.js"></script>
<script src="js/timeline.js"></script>
<script src="js/screens.js"></script>
<script src="js/app.js"></script>
</body>
</html>
